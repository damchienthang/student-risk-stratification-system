<!-- Unified Auth Modals -->
<div class="modal-overlay" id="loginModal" onclick="closeAllModals()">

  <!-- STEP 1: SELECT TYPE -->
  <div class="modal-box auth-step hidden" id="step-select-type" onclick="event.stopPropagation()"
    style="max-width: 450px; padding: 40px;">
    <button class="modal-close" onclick="closeAllModals()">✕</button>
    <div style="text-align: center; margin-bottom: 30px;">
      <h3 style="color: var(--primary); font-size: 1.5rem; text-transform: uppercase; font-weight: 800;">Xác nhận đối
        tượng</h3>
      <p style="font-size: 0.95rem; color: var(--text-dim); margin-top: 10px;">Bạn có phải sinh viên trường không?</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 15px;">
      <button onclick="showAuthStep('step-login-oulad')"
        style="padding: 18px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; text-align: left; display: flex; align-items: center; justify-content: space-between;">
        <span>CÓ, TÔI LÀ SINH VIÊN OULAD</span>
      </button>
      <button onclick="showAuthStep('step-external-choice')"
        style="padding: 18px; background: var(--bg-alt); color: var(--secondary); border: 2px solid var(--border); border-radius: 12px; font-weight: 800; cursor: pointer; text-align: left; display: flex; align-items: center; justify-content: space-between;">
        <span>KHÔNG, TÔI LÀ SINH VIÊN KHÁC</span>
      </button>
    </div>

  </div>

  <!-- STEP: OULAD LOGIN -->
  <div class="modal-box auth-step hidden" id="step-login-oulad" onclick="event.stopPropagation()"
    style="max-width: 400px; padding: 40px;">
    <button class="modal-close" onclick="showAuthStep('step-select-type')">x</button>
    <div style="text-align: center; margin-bottom: 30px;">
      <h3 style="color: var(--primary); font-size: 1.4rem; font-weight: 800;">ĐĂNG NHẬP</h3>
      <p style="font-size: 0.85rem; color: var(--text-dim); margin-top: 5px;">Sử dụng Mã SV được cấp sẵn</p>
    </div>
    <form action="/api/v1/auth/login" method="POST">
      <div style="margin-bottom: 15px;">
        <label
          style="display: block; font-size: 0.75rem; font-weight: 800; margin-bottom: 5px; color: var(--text-dim);">MÃ
          SINH VIÊN</label>
        <input type="text" name="username" placeholder="VD: 11391"
          style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-weight: 600;"
          required>
      </div>
      <div style="margin-bottom: 25px;">
        <label
          style="display: block; font-size: 0.75rem; font-weight: 800; margin-bottom: 5px; color: var(--text-dim);">MẬT
          KHẨU (MẶC ĐỊNH LÀ MÃ SV)</label>
        <input type="password" name="password" placeholder="••••••••"
          style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;" required>
        <a href="javascript:void(0)" onclick="showAuthStep('step-forgot-password')"
          style="display: block; margin-top: 10px; font-size: 0.75rem; color: var(--primary); font-weight: 700; text-decoration: none;">Quên
          mật khẩu?</a>
      </div>
      <button type="submit"
        style="width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: uppercase;">ĐĂNG
        NHẬP</button>
    </form>
  </div>

  <!-- STEP: EXTERNAL CHOICE (LOGIN/REG) -->
  <div class="modal-box auth-step hidden" id="step-external-choice" onclick="event.stopPropagation()"
    style="max-width: 400px; padding: 40px;">
    <button class="modal-close" onclick="showAuthStep('step-select-type')">x</button>
    <div style="text-align: center; margin-bottom: 30px;">
      <h3 style="color: var(--secondary); font-size: 1.4rem; font-weight: 800;">SINH VIÊN NGOÀI</h3>
      <p style="font-size: 0.85rem; color: var(--text-dim); margin-top: 5px;">Chọn hành động để tiếp tục</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 15px;">
      <button onclick="showAuthStep('step-login-external')"
        style="padding: 15px; background: var(--secondary); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;">ĐĂNG
        NHẬP</button>
      <button onclick="showAuthStep('step-register-external')"
        style="padding: 15px; background: white; color: var(--secondary); border: 2px solid var(--secondary); border-radius: 8px; font-weight: 700; cursor: pointer;">ĐĂNG
        KÝ TÀI KHOẢN MỚI</button>
    </div>
  </div>

  <!-- STEP: EXTERNAL LOGIN -->
  <div class="modal-box auth-step hidden" id="step-login-external" onclick="event.stopPropagation()"
    style="max-width: 400px; padding: 40px;">
    <button class="modal-close" onclick="showAuthStep('step-external-choice')">x</button>
    <div style="text-align: center; margin-bottom: 30px;">
      <h3 style="color: var(--secondary); font-size: 1.4rem; font-weight: 800;">ĐĂNG NHẬP</h3>
    </div>
    <form action="/api/v1/auth/login" method="POST">
      <div style="margin-bottom: 15px;">
        <label
          style="display: block; font-size: 0.75rem; font-weight: 800; margin-bottom: 5px; color: var(--text-dim);">TÊN
          ĐĂNG NHẬP</label>
        <input type="text" name="username" placeholder="Nhập tên đăng nhập"
          style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;" required>
      </div>
      <div style="margin-bottom: 20px;">
        <label
          style="display: block; font-size: 0.75rem; font-weight: 800; margin-bottom: 5px; color: var(--text-dim);">MẬT
          KHẨU</label>
        <input type="password" name="password" placeholder="••••••••"
          style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;" required>
        <a href="javascript:void(0)" onclick="showAuthStep('step-forgot-password')"
          style="display: block; margin-top: 10px; font-size: 0.75rem; color: var(--primary); font-weight: 700; text-decoration: none;">Quên
          mật khẩu?</a>
      </div>
      <button type="submit"
        style="width: 100%; padding: 14px; background: var(--secondary); color: white; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: uppercase;">ĐĂNG
        NHẬP</button>
    </form>
  </div>

  <!-- STEP: REGISTER EXTERNAL -->
  <div class="modal-box auth-step hidden" id="step-register-external" onclick="event.stopPropagation()"
    style="max-width: 450px; padding: 40px;">
    <button class="modal-close" onclick="showAuthStep('step-external-choice')">x</button>
    <div style="text-align: center; margin-bottom: 25px;">
      <h3 style="color: var(--primary); font-size: 1.4rem; font-weight: 800;">ĐĂNG KÝ TÀI KHOẢN MỚI</h3>
    </div>
    <form action="/api/v1/auth/register" method="POST">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
        <div>
          <label
            style="display: block; font-size: 0.7rem; font-weight: 800; margin-bottom: 5px; color: var(--text-dim);">TÊN
            ĐĂNG NHẬP</label>
          <input type="text" name="username" placeholder="VD: sv_tu_do"
            style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;" required>
        </div>
        <div>
          <label
            style="display: block; font-size: 0.7rem; font-weight: 800; margin-bottom: 5px; color: var(--text-dim);">HỌ
            VÀ TÊN</label>
          <input type="text" name="full_name" placeholder="Nguyễn Văn A"
            style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;" required>
        </div>
      </div>
      <div style="margin-bottom: 15px;">
        <label
          style="display: block; font-size: 0.7rem; font-weight: 800; margin-bottom: 5px; color: var(--text-dim);">EMAIL
          XÁC NHẬN</label>
        <input type="email" name="email" placeholder="example@email.com"
          style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;" required>
      </div>
      <div style="margin-bottom: 20px;">
        <label
          style="display: block; font-size: 0.7rem; font-weight: 800; margin-bottom: 5px; color: var(--text-dim);">MẬT
          KHẨU</label>
        <input type="password" name="password" placeholder="Nhập mật khẩu"
          style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;" required>
      </div>
      <button type="submit"
        style="width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 800; cursor: pointer;">ĐĂNG
        KÝ NGAY</button>
    </form>
  </div>

  <!-- STEP: FORGOT PASSWORD -->
  <div class="modal-box auth-step hidden" id="step-forgot-password" onclick="event.stopPropagation()"
    style="max-width: 400px; padding: 40px;">
    <button class="modal-close" onclick="closeAllModals()">✕</button>
    <div style="text-align: center; margin-bottom: 25px;">
      <h3 style="color: var(--primary); font-size: 1.4rem; font-weight: 800;">QUÊN MẬT KHẨU</h3>
      <p style="font-size: 0.85rem; color: var(--text-dim); margin-top: 5px;">Xác nhận email để đặt lại mật khẩu</p>
    </div>
    <form action="/api/v1/auth/forgot-password" method="POST">
      <div style="margin-bottom: 15px;">
        <label
          style="display: block; font-size: 0.7rem; font-weight: 800; margin-bottom: 5px; color: var(--text-dim);">EMAIL
          ĐÃ ĐĂNG KÝ</label>
        <input type="email" name="email" placeholder="example@email.com"
          style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;" required>
      </div>
      <div style="margin-bottom: 20px;">
        <label
          style="display: block; font-size: 0.7rem; font-weight: 800; margin-bottom: 5px; color: var(--text-dim);">MẬT
          KHẨU MỚI</label>
        <input type="password" name="new_password" placeholder="Nhập mật khẩu mới"
          style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px;" required>
      </div>
      <button type="submit"
        style="width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 800; cursor: pointer;">XÁC
        NHẬN ĐỔI MẬT KHẨU</button>
    </form>
  </div>

</div>

<script>
  function toggleLoginModal() {
    const modal = document.getElementById('loginModal');
    if (!modal) return;

    if (window.getComputedStyle(modal).display === 'flex') {
      closeAllModals();
    } else {
      showAuthStep('step-select-type');
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }
  }

  function showAuthStep(stepId) {
    console.log("Showing auth step:", stepId);
    const steps = document.querySelectorAll('.auth-step');
    steps.forEach(step => {
      step.classList.add('hidden');
    });
    const target = document.getElementById(stepId);
    if (target) {
      target.classList.remove('hidden');
    } else {
      console.error("Step ID not found:", stepId);
    }
  }

  function closeAllModals() {
    const loginModal = document.getElementById('loginModal');
    if (loginModal) loginModal.style.display = 'none';

    const imageModal = document.getElementById('modalOverlay');
    if (imageModal) imageModal.classList.add('hidden');

    document.body.style.overflow = 'auto';
  }
</script>
