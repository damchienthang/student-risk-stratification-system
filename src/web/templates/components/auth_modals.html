<!-- Unified Auth Modals (Single Login Form) -->
<style>
  /* Override modal overlay specifically for login modal */
  #loginModal {
    background: rgba(15, 23, 42, 0.6) !important;
    backdrop-filter: blur(8px) !important;
    transition: opacity 0.3s ease;
  }

  /* Make the modal box itself softer and more premium with spring entrance */
  #loginModal .modal-box {
    animation: authModalEntrance 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
    border-radius: 20px !important;
    box-shadow: 0 24px 60px rgba(15, 23, 42, 0.22) !important;
    border: 1px solid rgba(255, 255, 255, 0.8) !important;
    background: #ffffff !important;
  }

  @keyframes authModalEntrance {
    from {
      opacity: 0;
      transform: scale(0.95) translateY(12px);
    }
    to {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  .auth-form-group {
    margin-bottom: 20px;
  }

  .auth-label {
    display: block;
    font-size: 0.82rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .auth-input {
    width: 100%;
    padding: 14px 18px;
    border: 1.5px solid #e2e8f0;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--secondary);
    background: #f8fafc;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .auth-input::placeholder {
    color: #94a3b8;
  }

  .auth-input:hover {
    background: #f1f5f9;
    border-color: #cbd5e1;
  }

  .auth-input:focus {
    background: white;
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(200, 16, 46, 0.08);
    outline: none;
  }

  .auth-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-weight: 800;
    font-size: 0.95rem;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    letter-spacing: 0.5px;
  }

  .auth-btn-primary {
    background: var(--primary);
    color: white;
    box-shadow: 0 4px 12px rgba(200, 16, 46, 0.2);
  }

  .auth-btn-primary:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(200, 16, 46, 0.3);
  }

  .auth-btn-primary:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(200, 16, 46, 0.2);
  }

  .auth-btn-secondary {
    background: var(--secondary);
    color: white;
  }

  .auth-btn-secondary:hover {
    background: #1e293b;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(15, 23, 42, 0.15);
  }

  .auth-btn-secondary:active {
    transform: translateY(0);
  }

  .auth-link {
    font-size: 0.95rem;
    color: var(--primary);
    font-weight: 700;
    text-decoration: none;
    transition: color 0.2s;
  }

  .auth-link:hover {
    text-decoration: underline;
    color: var(--primary-dark);
  }

  .auth-modal-close {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(15, 23, 42, 0.05);
    border: none;
    width: 32px;
    height: 32px;
    font-size: 0.9rem;
    font-weight: 700;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.25s ease;
    z-index: 10;
    outline: none;
  }

  .auth-modal-close:hover {
    background: rgba(200, 16, 46, 0.1);
    color: var(--primary);
    transform: rotate(90deg);
  }

  .auth-header {
    text-align: center;
    margin-bottom: 32px;
  }

  .auth-header h3 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 1.7rem;
    font-weight: 900;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .auth-header p {
    font-size: 0.95rem;
    color: var(--text-dim);
    font-weight: 500;
    margin: 0;
  }

  .auth-footer-text {
    text-align: center;
    margin-top: 26px;
    font-size: 0.95rem;
    color: var(--text-dim);
    line-height: 1.5;
  }
</style>

<div class="modal-overlay" id="loginModal" onclick="closeAllModals()">

  <div class="modal-box" onclick="event.stopPropagation()" style="max-width: 460px; padding: 0; overflow: hidden;">
    <button class="auth-modal-close" onclick="closeAllModals()">✕</button>

    <!-- LOGIN VIEW -->
    <div id="view-login" style="padding: 45px 40px;">
      <div class="auth-header">
        <h3 style="color: var(--primary);">ĐĂNG NHẬP</h3>
        <p>Hệ thống phân tầng rủi ro học tập</p>
      </div>

      <!-- FORM -->
      <form action="/api/v1/auth/login" method="POST">
        <div class="auth-form-group">
          <label class="auth-label">TÊN ĐĂNG NHẬP / MÃ SV</label>
          <input type="text" name="username" class="auth-input" placeholder="VD: 11391 hoặc khach_01" required>
        </div>

        <div class="auth-form-group" style="margin-bottom: 30px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="auth-label" style="margin: 0;">MẬT KHẨU</label>
            <a href="javascript:void(0)" onclick="switchView('view-forgot')" class="auth-link"
              style="font-size: 1rem;">Quên mật khẩu?</a>
          </div>
          <input type="password" name="password" class="auth-input" style="margin-top: 8px;" placeholder="••••••••"
            required>
        </div>

        <button type="submit" class="auth-btn auth-btn-primary">Đăng nhập</button>
      </form>

      <!-- Register Link -->
      <div class="auth-footer-text">
        Sinh viên / Khách chưa có tài khoản? <br>
        <a href="javascript:void(0)" onclick="switchView('view-register')" class="auth-link"
          style="display: inline-block; margin-top: 10px; font-size: 1rem;">Đăng ký ngay</a>
      </div>
    </div>

    <!-- REGISTER VIEW -->
    <div id="view-register" class="hidden" style="padding: 45px 40px;">
      <div class="auth-header">
        <h3 style="color: var(--secondary);">ĐĂNG KÝ TÀI KHOẢN</h3>
        <p>Dành cho tài khoản trải nghiệm</p>
      </div>

      <form action="/api/v1/auth/register" method="POST">
        <div style="display: flex; gap: 15px;">
          <div class="auth-form-group" style="flex: 1;">
            <label class="auth-label">Tên đăng nhập</label>
            <input type="text" name="username" class="auth-input" placeholder="VD: khach_01" required>
          </div>
          <div class="auth-form-group" style="flex: 1;">
            <label class="auth-label">Họ và tên</label>
            <input type="text" name="full_name" class="auth-input" placeholder="Nguyễn Văn A" required>
          </div>
        </div>

        <div class="auth-form-group">
          <label class="auth-label">Email</label>
          <input type="email" name="email" class="auth-input" placeholder="example@email.com" required>
        </div>

        <div class="auth-form-group" style="margin-bottom: 30px;">
          <label class="auth-label">Mật khẩu</label>
          <input type="password" name="password" class="auth-input" placeholder="Tạo mật khẩu an toàn" required>
        </div>

        <button type="submit" class="auth-btn auth-btn-secondary" style="margin-bottom: 20px;">Tạo Tài Khoản</button>
        <div class="auth-footer-text">
          Đã có tài khoản? <a href="javascript:void(0)" onclick="switchView('view-login')" class="auth-link"
            style="font-size: 1rem;">Đăng nhập</a>
        </div>
      </form>
    </div>

    <!-- FORGOT PASSWORD VIEW -->
    <div id="view-forgot" class="hidden" style="padding: 40px 40px;">
      <div class="auth-header">
        <h3 style="color: var(--secondary);">QUÊN MẬT KHẨU</h3>
        <p>Vui lòng nhập Email để khôi phục</p>
      </div>

      <form action="/api/v1/auth/forgot-password" method="POST">
        <div class="auth-form-group">
          <label class="auth-label">Email đã đăng ký</label>
          <input type="email" name="email" class="auth-input" placeholder="example@email.com" required>
        </div>

        <div class="auth-form-group" style="margin-bottom: 25px;">
          <label class="auth-label">Mật khẩu mới</label>
          <input type="password" name="new_password" class="auth-input" placeholder="Nhập mật khẩu mới" required>
        </div>

        <button type="submit" class="auth-btn auth-btn-primary" style="margin-bottom: 15px;">Đổi Mật Khẩu</button>
        <div class="auth-footer-text">
          <a href="javascript:void(0)" onclick="switchView('view-login')" class="auth-link">Quay lại đăng nhập</a>
        </div>
      </form>
    </div>

  </div>
</div>

<script>
  // UI logic cho việc chuyển Form (Đăng nhập, Đăng ký, Quên MK)
  function switchView(viewId) {
    const views = ['view-login', 'view-register', 'view-forgot'];
    views.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    });

    const target = document.getElementById(viewId);
    if (target) target.classList.remove('hidden');
  }

  // Toggle Modal Chính
  function toggleLoginModal() {
    const modal = document.getElementById('loginModal');
    if (!modal) return;

    if (window.getComputedStyle(modal).display === 'flex') {
      closeAllModals();
    } else {
      switchView('view-login'); // Reset về trang login
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }
  }

  function closeAllModals() {
    const loginModal = document.getElementById('loginModal');
    if (loginModal) loginModal.style.display = 'none';

    const imageModal = document.getElementById('modalOverlay');
    if (imageModal) imageModal.classList.add('hidden');

    document.body.style.overflow = 'auto';
  }
</script>
