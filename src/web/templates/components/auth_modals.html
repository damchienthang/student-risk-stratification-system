<!-- Unified Auth Modals (Single Login Form) -->
<style>
  .auth-form-group {
    margin-bottom: 20px;
  }

  .auth-label {
    display: block;
    font-size: 1rem;
    font-weight: 800;
    margin-bottom: 8px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .auth-input {
    width: 100%;
    padding: 16px 18px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1.05rem;
    font-weight: 500;
    background: #f9fafb;
    transition: all 0.3s;
  }

  .auth-input:focus {
    background: white;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.1);
    outline: none;
  }

  .auth-btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 8px;
    font-weight: 800;
    font-size: 1.05rem;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .auth-btn-primary {
    background: var(--primary);
    color: white;
    box-shadow: 0 4px 12px rgba(200, 16, 46, 0.3);
  }

  .auth-btn-primary:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(200, 16, 46, 0.4);
  }

  .auth-btn-secondary {
    background: var(--secondary);
    color: white;
  }

  .auth-btn-secondary:hover {
    background: #1a1e21;
    transform: translateY(-2px);
  }

  .auth-link {
    font-size: 0.95rem;
    color: var(--primary);
    font-weight: 700;
    text-decoration: none;
    transition: color 0.2s;
  }

  .auth-link:hover {
    text-decoration: underline;
  }
</style>

<div class="modal-overlay" id="loginModal" onclick="closeAllModals()">

  <div class="modal-box" onclick="event.stopPropagation()" style="max-width: 460px; padding: 0; overflow: hidden;">
    <button class="modal-close" onclick="closeAllModals()"
      style="z-index: 10; top: 15px; right: 15px; background: rgba(0,0,0,0.05); width: 36px; height: 36px; font-size: 1.1rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0.6;">✕</button>

    <!-- LOGIN VIEW -->
    <div id="view-login" style="padding: 45px 40px;">
      <div style="text-align: center; margin-bottom: 35px;">
        <h3 style="font-size: 1.8rem; font-weight: 900; color: var(--primary);">ĐĂNG NHẬP</h3>
        <p style="font-size: 1.05rem; color: var(--text-dim); margin-top: 8px;">Hệ thống phân tầng rủi ro học tập</p>
      </div>

      <!-- FORM -->
      <form action="/api/v1/auth/login" method="POST">
        <div class="auth-form-group">
          <label class="auth-label">TÊN ĐĂNG NHẬP / MÃ SV</label>
          <input type="text" name="username" class="auth-input" placeholder="VD: 11391 hoặc khach_01" required>
        </div>

        <div class="auth-form-group" style="margin-bottom: 30px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="auth-label" style="margin: 0;">MẬT KHẨU</label>
            <a href="javascript:void(0)" onclick="switchView('view-forgot')" class="auth-link"
              style="font-size: 1rem;">Quên mật khẩu?</a>
          </div>
          <input type="password" name="password" class="auth-input" style="margin-top: 8px;" placeholder="••••••••"
            required>
        </div>

        <button type="submit" class="auth-btn auth-btn-primary">Đăng nhập</button>
      </form>

      <!-- Register Link -->
      <div style="text-align: center; margin-top: 30px; font-size: 1.05rem;">
        Sinh viên / Khách chưa có tài khoản? <br>
        <a href="javascript:void(0)" onclick="switchView('view-register')" class="auth-link"
          style="display: inline-block; margin-top: 10px; font-size: 1rem;">Đăng ký ngay</a>
      </div>
    </div>

    <!-- REGISTER VIEW -->
    <div id="view-register" class="hidden" style="padding: 45px 40px;">
      <div style="text-align: center; margin-bottom: 35px;">
        <h3 style="font-size: 1.8rem; font-weight: 900; color: var(--secondary);">ĐĂNG KÝ TÀI KHOẢN</h3>
        <p style="font-size: 1.05rem; color: var(--text-dim); margin-top: 8px;">Dành cho tài khoản trải nghiệm (Khách)
        </p>
      </div>

      <form action="/api/v1/auth/register" method="POST">
        <div style="display: flex; gap: 15px;">
          <div class="auth-form-group" style="flex: 1;">
            <label class="auth-label">Tên đăng nhập</label>
            <input type="text" name="username" class="auth-input" placeholder="VD: khach_01" required>
          </div>
          <div class="auth-form-group" style="flex: 1;">
            <label class="auth-label">Họ và tên</label>
            <input type="text" name="full_name" class="auth-input" placeholder="Nguyễn Văn A" required>
          </div>
        </div>

        <div class="auth-form-group">
          <label class="auth-label">Email</label>
          <input type="email" name="email" class="auth-input" placeholder="example@email.com" required>
        </div>

        <div class="auth-form-group" style="margin-bottom: 30px;">
          <label class="auth-label">Mật khẩu</label>
          <input type="password" name="password" class="auth-input" placeholder="Tạo mật khẩu an toàn" required>
        </div>

        <button type="submit" class="auth-btn auth-btn-secondary" style="margin-bottom: 20px;">Tạo Tài Khoản</button>
        <div style="text-align: center; font-size: 1.05rem;">
          Đã có tài khoản? <a href="javascript:void(0)" onclick="switchView('view-login')" class="auth-link"
            style="font-size: 1rem;">Đăng nhập</a>
        </div>
      </form>
    </div>

    <!-- FORGOT PASSWORD VIEW -->
    <div id="view-forgot" class="hidden" style="padding: 40px 40px;">
      <div style="text-align: center; margin-bottom: 25px;">
        <h3 style="font-size: 1.4rem; font-weight: 900; color: var(--secondary);">QUÊN MẬT KHẨU</h3>
        <p style="font-size: 1rem; color: var(--text-dim); margin-top: 5px;">Vui lòng nhập Email để khôi phục</p>
      </div>

      <form action="/api/v1/auth/forgot-password" method="POST">
        <div class="auth-form-group">
          <label class="auth-label">Email đã đăng ký</label>
          <input type="email" name="email" class="auth-input" placeholder="example@email.com" required>
        </div>

        <div class="auth-form-group" style="margin-bottom: 25px;">
          <label class="auth-label">Mật khẩu mới</label>
          <input type="password" name="new_password" class="auth-input" placeholder="Nhập mật khẩu mới" required>
        </div>

        <button type="submit" class="auth-btn auth-btn-primary" style="margin-bottom: 15px;">Đổi Mật Khẩu</button>
        <div style="text-align: center; font-size: 1rem;">
          <a href="javascript:void(0)" onclick="switchView('view-login')" class="auth-link">Quay lại đăng nhập</a>
        </div>
      </form>
    </div>

  </div>
</div>

<script>
  // UI logic cho việc chuyển Form (Đăng nhập, Đăng ký, Quên MK)
  function switchView(viewId) {
    const views = ['view-login', 'view-register', 'view-forgot'];
    views.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    });

    const target = document.getElementById(viewId);
    if (target) target.classList.remove('hidden');
  }

  // Toggle Modal Chính
  function toggleLoginModal() {
    const modal = document.getElementById('loginModal');
    if (!modal) return;

    if (window.getComputedStyle(modal).display === 'flex') {
      closeAllModals();
    } else {
      switchView('view-login'); // Reset về trang login
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }
  }

  function closeAllModals() {
    const loginModal = document.getElementById('loginModal');
    if (loginModal) loginModal.style.display = 'none';

    const imageModal = document.getElementById('modalOverlay');
    if (imageModal) imageModal.classList.add('hidden');

    document.body.style.overflow = 'auto';
  }
</script>
