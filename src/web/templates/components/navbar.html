<header class="header"
  style="background: white; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; box-shadow: var(--shadow-sm); width: 100vw; left: 0; right: 0;">
  <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 12px 4%;">
    <!-- LOGO CĂN TRÁI -->
    <a href="/" class="logo"
      style="display: flex; align-items: center; gap: 12px; text-decoration: none; flex-shrink: 0;">
      <div style="font-weight: 900; color: var(--primary); font-size: 1.9rem; letter-spacing: -0.5px; font-family: 'Inter', sans-serif;">
        Risk<span style="font-weight: 800;">Sight</span>
      </div>
      <div style="border-left: 2px solid var(--border); padding-left: 12px; display: flex; flex-direction: column; justify-content: center;">
        <span style="font-size: 0.85rem; color: var(--primary); font-weight: 800; display: block; text-transform: uppercase; letter-spacing: 1px; line-height: 1.1;">Đánh giá rủi ro trượt môn</span>
        <span style="font-size: 0.65rem; color: var(--text-dim); font-weight: 600; display: block; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px;">STUDENT RISK STRATIFICATION SYSTEM</span>
      </div>
    </a>

    <!-- NAVIGATE CĂN PHẢI -->
    <nav class="nav" style="display: flex; gap: 30px; align-items: center; margin-left: auto;">
      <a href="/" class="nav-link">TRANG CHỦ</a>
      <a href="/#model" class="nav-link">MÔ HÌNH</a>
      <a href="/about" class="nav-link">GIỚI THIỆU</a>
      <div id="authNavArea" style="display: flex; align-items: center; gap: 15px; margin-left: 10px;">
        {% if user %}
        <div class="user-dropdown">
          <button class="user-btn" onclick="toggleDropdown(event)"
            style="background: var(--bg-alt); border: 1px solid var(--border); padding: 10px 25px; border-radius: var(--radius-sm); display: flex; align-items: center; gap: 12px; cursor: pointer; font-weight: 700; transition: all 0.2s;">
            <span class="user-name">{{ user.full_name or user.username }}</span>
            <span class="dropdown-arrow" style="font-size: 0.6rem; opacity: 0.5;">▼</span>
          </button>
          <div class="dropdown-content"
            style="display: none; position: absolute; right: 0; background: white; min-width: 220px; box-shadow: var(--shadow-md); border-radius: var(--radius-sm); padding: 12px 0; z-index: 9999; border: 1px solid var(--border); margin-top: 10px;">
            {% if user.role == 'lecturer' %}
            <a href="/admin"
              style="color: var(--text); padding: 12px 25px; text-decoration: none; display: block; font-size: 0.95rem; font-weight: 600;">Bảng
              quản trị</a>
            {% else %}
            <a href="/student"
              style="color: var(--text); padding: 12px 25px; text-decoration: none; display: block; font-size: 0.95rem; font-weight: 600;">Khu
              vực cá nhân</a>
            {% endif %}
            <hr style="border: 0; border-top: 1px solid var(--border); margin: 8px 0;">
            <a href="/api/v1/auth/logout" onclick="return confirm('Bạn có chắc chắn muốn đăng xuất không?');"
              style="color: var(--primary) !important; padding: 12px 25px; text-decoration: none; display: block; font-size: 0.95rem; font-weight: 800;">Đăng
              xuất</a>
          </div>

        </div>
        {% else %}
        <button onclick="toggleLoginModal()" class="login-trigger-btn"
          style="background: var(--primary); color: white; border: none; padding: 12px 35px; border-radius: var(--radius-sm); font-weight: 800; cursor: pointer; transition: all 0.3s; font-size: 0.9rem; letter-spacing: 0.5px;">ĐĂNG
          NHẬP</button>
        {% endif %}
      </div>
    </nav>
  </div>
</header>

<style>
  /* Dropdown Styles - Integrated for portability */
  .user-dropdown {
    position: relative;
    display: inline-block;
  }

  .user-btn:hover {
    background: var(--border) !important;
    transform: translateY(-1px);
  }

  .dropdown-content a:hover {
    background: #f8f9fa;
    color: var(--primary);
  }

  /* Nav Link Styles & Click Effects */
  .nav-link {
    text-decoration: none;
    color: var(--text) !important;
    font-weight: 700;
    font-size: 0.9rem;
    position: relative;
    padding: 8px 4px;
    display: inline-block;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .nav-link::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--primary);
    transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .nav-link:hover {
    color: var(--primary) !important;
  }

  .nav-link:hover::after {
    width: 100%;
  }

  .nav-link.active {
    color: var(--primary) !important;
  }

  .nav-link.active::after {
    width: 100%;
  }

  /* Press / Click Feedback */
  .nav-link:active {
    transform: scale(0.92);
  }
</style>

<script>
  function toggleDropdown(e) {
    e.stopPropagation();
    const dropdown = document.querySelector('.dropdown-content');
    dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
  }
  document.addEventListener('click', () => {
    const dropdown = document.querySelector('.dropdown-content');
    if (dropdown) dropdown.style.display = 'none';
  });

  // Highlight active link based on current path
  document.addEventListener('DOMContentLoaded', () => {
    const currentPath = window.location.pathname;
    const currentHash = window.location.hash;
    document.querySelectorAll('.nav-link').forEach(link => {
      const href = link.getAttribute('href');
      if (href === currentPath || (href.startsWith('/#') && currentHash && href.endsWith(currentHash))) {
        link.classList.add('active');
      } else if (currentPath === '/' && href === '/') {
        link.classList.add('active');
      }
    });
  });
</script>
